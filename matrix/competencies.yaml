# Модель компетенций 1С-разработчика
# Три группы навыков с детализацией по уровням
#
# Автор: Айдар Сафин
# Контакты: aidar@aidarsafin.ru
# Репозиторий: https://github.com/aidarsafindev/1c-career-compass
# Лицензия: MIT (см. LICENSE)

competency_groups:
  hard_skills:
    name: "Hard Skills — Технические навыки"
    description: "Знание платформы, технологий, инструментов"
    weight_by_grade:
      junior: 0.80
      middle: 0.60
      senior: 0.40
      lead: 0.30
      architect: 0.50
      cto: 0.20

    competencies:
      platform:
        name: "Платформа 1С:Предприятие"
        levels:
          junior:
            - "Знает типовые конфигурации на уровне пользователя"
            - "Понимает метаданные: справочники, документы, регистры"
            - "Умеет писать запросы средней сложности"
            - "Работает с управляемыми формами"
            - "Понимает подсистему прав доступа (роли)"
          middle:
            - "Глубоко знает одну-две типовые конфигурации"
            - "Проектирует структуру метаданных для новых подсистем"
            - "Пишет сложные запросы с временными таблицами"
            - "Работает с СКД, расширениями, механизмом подписок"
            - "Понимает устройство кластера серверов"
          senior:
            - "Знает архитектуру типовых конфигураций"
            - "Проектирует архитектуру метаданных для системы в целом"
            - "Оптимизирует запросы под высоконагруженные сценарии"
            - "Работает с EDT, Git, CI/CD в контексте 1С"
            - "Понимает ограничения платформы и способы их обхода"
          lead:
            - "Определяет стандарты проектирования метаданных"
            - "Проводит аудит архитектуры конфигураций"
            - "Оценивает влияние изменений платформы на систему"
            - "Принимает решения о переходе на новые версии платформы"
          architect:
            - "Проектирует архитектуру корпоративных систем на 1С"
            - "Выбирает между типовым решением и custom-разработкой"
            - "Определяет стратегию обновлений платформы и конфигураций"
            - "Взаимодействует с вендором по техническим вопросам"
          cto:
            - "Понимает roadmap платформы 1С и экосистемы"
            - "Оценивает технологические риски использования 1С"
            - "Принимает решения о диверсификации технологического стека"

      databases:
        name: "Базы данных и SQL"
        levels:
          junior:
            - "Понимает разницу между файловой и клиент-серверной"
            - "Умеет анализировать план запроса"
            - "Знает основные индексы и их назначение"
          middle:
            - "Настраивает индексы под конкретные запросы"
            - "Понимает блокировки и транзакции"
            - "Работает с PostgreSQL и MS SQL на уровне администратора"
          senior:
            - "Оптимизирует производительность на уровне СУБД"
            - "Настраивает секционирование таблиц"
            - "Проектирует стратегию резервного копирования"
            - "Диагностирует проблемы производительности через ТЖ и логи СУБД"
          lead:
            - "Определяет требования к инфраструктуре СУБД"
            - "Планирует миграцию между СУБД"
            - "Оценивает влияние архитектурных решений на производительность БД"
          architect:
            - "Выбирает СУБД под требования проекта"
            - "Проектирует топологию баз данных"
            - "Определяет стратегию хранения и архивирования данных"
          cto:
            - "Понимает рынок СУБД и тренды"
            - "Принимает решения о выборе СУБД для компании"

      integrations:
        name: "Интеграции и обмены данными"
        levels:
          junior:
            - "Понимает планы обмена и РИБ"
            - "Умеет настраивать простые HTTP-сервисы"
          middle:
            - "Проектирует правила обмена"
            - "Работает с REST API, JSON, XML"
            - "Настраивает интеграцию через RabbitMQ"
          senior:
            - "Проектирует интеграционную архитектуру"
            - "Работает с Kafka, gRPC, GraphQL"
            - "Обеспечивает гарантированную доставку сообщений"
            - "Решает проблемы консистентности в распределённых системах"
          lead:
            - "Определяет стандарты интеграций для команды"
            - "Выбирает интеграционные паттерны и технологии"
            - "Оценивает стоимость поддержки интеграций"
          architect:
            - "Проектирует корпоративную интеграционную шину"
            - "Определяет стратегию интеграций между системами"
          cto:
            - "Понимает рынок интеграционных решений"
            - "Принимает решения о make vs buy для интеграций"

      devops:
        name: "DevOps и CI/CD"
        levels:
          junior:
            - "Понимает что такое Git и зачем он нужен"
            - "Умеет делать commit, push, pull"
          middle:
            - "Работает с Git в команде: ветки, merge, ревью"
            - "Настраивает простые CI/CD пайплайны"
          senior:
            - "Проектирует CI/CD для 1С: сборка, тестирование, деплой"
            - "Работает с Docker и контейнеризацией"
            - "Настраивает мониторинг и алертинг"
          lead:
            - "Определяет DevOps-стратегию команды"
            - "Внедряет практики SRE и Chaos Engineering"
          architect:
            - "Проектирует инфраструктуру разработки и доставки"
          cto:
            - "Определяет технологический стек DevOps"
            - "Оценивает окупаемость инвестиций в инфраструктуру"

      testing:
        name: "Тестирование и качество"
        levels:
          junior:
            - "Пишет модульные тесты под руководством"
            - "Понимает что такое сценарное тестирование"
          middle:
            - "Самостоятельно пишет модульные и сценарные тесты"
            - "Использует Vanessa Automation"
          senior:
            - "Проектирует стратегию тестирования для проекта"
            - "Внедряет TDD и BDD в команде"
            - "Настраивает нагрузочное тестирование"
          lead:
            - "Определяет стандарты качества кода"
            - "Внедряет метрики качества и практики ревью"
          architect:
            - "Проектирует тестируемую архитектуру"
          cto:
            - "Определяет культуру качества в компании"

      security:
        name: "Безопасность"
        levels:
          junior:
            - "Понимает основы: права доступа, роли"
          middle:
            - "Настраивает RLS, профили безопасности"
            - "Понимает угрозы: SQL-инъекции, XSS в веб-клиенте"
          senior:
            - "Проводит аудит безопасности конфигурации"
            - "Внедряет безопасную разработку (Security Champions)"
            - "Работает с криптографией: ЭЦП, TLS, шифрование"
          lead:
            - "Определяет политику безопасности для команды"
          architect:
            - "Проектирует безопасную архитектуру систем"
          cto:
            - "Определяет стратегию информационной безопасности"

  soft_skills:
    name: "Soft Skills — Коммуникация и лидерство"
    description: "Умение работать с людьми, командами, заказчиками"
    weight_by_grade:
      junior: 0.15
      middle: 0.25
      senior: 0.35
      lead: 0.40
      architect: 0.30
      cto: 0.30

    competencies:
      communication:
        name: "Коммуникация"
        levels:
          junior:
            - "Чётко описывает проблему в тикете"
            - "Задаёт вопросы когда не понимает"
          middle:
            - "Объясняет технические решения команде"
            - "Пишет понятную документацию"
          senior:
            - "Общается с заказчиком без посредников"
            - "Проводит технические презентации"
            - "Разрешает конфликтные ситуации"
          lead:
            - "Проводит сложные переговоры"
            - "Представляет команду перед руководством"
          architect:
            - "Защищает архитектурные решения перед стейкхолдерами"
            - "Пишет статьи и выступает на конференциях"
          cto:
            - "Представляет компанию на рынке"
            - "Выступает ключевым спикером на конференциях"

      mentoring:
        name: "Менторинг и развитие других"
        levels:
          junior:
            - "Учится у более опытных коллег"
          middle:
            - "Помогает джунам с типовыми задачами"
            - "Проводит код-ревью начального уровня"
          senior:
            - "Менторит мидлов"
            - "Проводит парное программирование"
            - "Помогает с карьерным планированием"
          lead:
            - "Выстраивает систему менторинга в команде"
            - "Оценивает компетенции и даёт развивающую обратную связь"
            - "Растит будущих лидов"
          architect:
            - "Менторит старших разработчиков в архитектуре"
            - "Создаёт образовательные материалы"
          cto:
            - "Формирует культуру обучения в компании"
            - "Развивает бренд компании как работодателя"

      leadership:
        name: "Лидерство и управление"
        levels:
          junior:
            - "Берёт ответственность за свои задачи"
          middle:
            - "Ведёт небольшие задачи от оценки до сдачи"
            - "Проявляет инициативу в улучшении процессов"
          senior:
            - "Ведёт технические проекты"
            - "Принимает решения в условиях неопределённости"
            - "Влияет на техническую культуру команды"
          lead:
            - "Управляет командой: планирование, мотивация, 1-1"
            - "Разрешает конфликты"
            - "Отвечает за доставку и качество"
          architect:
            - "Ведёт техническую стратегию без прямой власти"
            - "Влияет на решения через экспертизу и авторитет"
          cto:
            - "Управляет техническим департаментом"
            - "Формирует видение и стратегию"
            - "Принимает кадровые решения"

  business_skills:
    name: "Business Skills — Бизнес и продукт"
    description: "Понимание бизнеса, продукта и экономики разработки"
    weight_by_grade:
      junior: 0.05
      middle: 0.15
      senior: 0.25
      lead: 0.30
      architect: 0.20
      cto: 0.50

    competencies:
      business_domain:
        name: "Предметная область"
        levels:
          junior:
            - "Понимает базовые бизнес-термины проекта"
          middle:
            - "Знает бизнес-процессы своего проекта"
            - "Понимает как автоматизация влияет на бизнес"
          senior:
            - "Глубоко знает предметную область"
            - "Предлагает решения на стыке бизнеса и технологий"
          lead:
            - "Понимает бизнес-модель компании"
            - "Оценивает бизнес-влияние технических решений"
          architect:
            - "Проектирует системы под бизнес-стратегию"
            - "Прогнозирует развитие предметной области"
          cto:
            - "Понимает рынок и конкурентов"
            - "Определяет как технологии создают конкурентное преимущество"

      product:
        name: "Продуктовое мышление"
        levels:
          junior:
            - "Понимает кто пользователь и зачем ему продукт"
          middle:
            - "Предлагает улучшения продукта"
          senior:
            - "Оценивает техническую реализуемость продуктовых идей"
            - "Участвует в приоритизации фич"
          lead:
            - "Управляет бэклогом разработки"
            - "Балансирует фичи, баги и технический долг"
          architect:
            - "Определяет техническую стратегию продукта"
          cto:
            - "Определяет продуктовую стратегию с точки зрения технологий"

      economics:
        name: "Экономика разработки"
        levels:
          junior:
            - "Понимает что его время стоит денег"
          middle:
            - "Оценивает трудозатраты"
            - "Понимает что такое технический долг"
          senior:
            - "Оценивает стоимость архитектурных решений"
            - "Считает ROI технических инициатив"
          lead:
            - "Управляет бюджетом команды"
            - "Оценивает стоимость найма и удержания"
          architect:
            - "Оценивает совокупную стоимость владения (TCO) систем"
          cto:
            - "Управляет бюджетом технического департамента"
            - "Принимает решения о build vs buy"
